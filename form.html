<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML FORM</title>
</head>
<body>
    <h2>Creat Form in HTML</h2>
    <form>
        <h3>Student Registration Form</h3>
        <label>Fullname</label><br>
        <input type="text" name="name" placeholder="Enter your Fullname" required><br>
        <label>Email</label><br>
        <input type="email" name="email" placeholder="Enter your Email" required><br>
        <label>Password</label><br>
        <input type="password" name="password" placeholder="Enter your password" required><br>
        <label>Date of Birth</label><br>
        <input type="date" name="birthday" required><br>
        <label>Class</label>
        <select required>
            <option>X-1</option>
            <option>X-2</option>
            <option>X-3</option>
        </select><br>
        <label>Gender</label><br>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female <br>
        <label>Skill</label><br>
        <input type="checkbox">HTML
        <input type="checkbox">Class
        <input type="checkbox">JavaScript <br>
        <label>About Yourself</label><br>
        <textarea rows="5" cols="40" placeholder="Enter about yourself here ...." required></textarea>
        <button type="Submit">submit</button>
        <button type="reset">reset</button> 
    </form>
</body>
</html>
