<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML List</title>
</head>
<body>
    <h1>HTML List</h1>
    <hr>
    <ol>
        <li>Monday</li>
        <li>Tuesday</li>
        <li>Wednesday</li>
    </ol>
    <ol type="I">
        <li>Monday</li>
        <li>Tuesday</li>
        <li>Wednesday</li>
    </ol>
    <ol type="A">
        <li>Monday</li>
        <li>TUesday</li>
        <li>Wednesday</li>
    </ol>
    <ul>
        <ul type="circle"
        <li>Monday</li>
        <li>Tuesday</li>
        <li>Wenesday</li>
    </ul>
    <ul type="square">
        <li>Monday</li>
        <li>Tuesday</li>
        <li>Wednesday</li>
    </ul>
    <dl>
        <dt>HTML</dt>
        <dd>Hypertext Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheet</dd>
    </dl>
</body>
</html>
