<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Student Data</title>
   
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">


    <div class="w-full max-w-4xl bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
        
        <table class="w-full text-center border-collapse">
         
            <thead>
                <tr class="bg-indigo-600 text-white font-bold uppercase tracking-wider text-sm">
                    <th colspan="4" class="py-4 px-6 text-base shadow-sm">
                        Student Data
                    </th>
                </tr>
        
                <tr class="bg-slate-200 text-slate-700 font-semibold text-sm uppercase tracking-wider border-b border-slate-300">
                    <th class="py-3 px-4 w-16 border-r border-slate-300">No</th>
                    <th class="py-3 px-6 border-r border-slate-300">Name</th>
                    <th class="py-3 px-6 border-r border-slate-300">Class</th>
                    <th class="py-3 px-6">Address</th>
                </tr>
            </thead>

        
            <tbody class="text-sm divide-y divide-slate-200">
              
                <tr class="hover:bg-indigo-50/50 transition-colors">
                    <td class="py-3 px-4 font-medium border-r border-slate-200">1</td>
                    <td class="py-3 px-6 border-r border-slate-200 capitalize">name</td>
                    <td rowspan="2" class="py-3 px-6 font-semibold text-black-600  border-r border-slate-200 align-middle">
                        X-8
                    </td>
                    <td class="py-3 px-6 capitalize">surakarta</td>
                </tr>

              
                <tr class="hover:bg-indigo-50/50 transition-colors">
                    <td class="py-3 px-4 font-medium border-r border-slate-200">2</td>
                    <td class="py-3 px-6 border-r border-slate-200 capitalize">name</td>
                  
                    <td class="py-3 px-6 capitalize">boyolali</td>
                </tr>

            
                <tr class="hover:bg-indigo-50/50 transition-colors bg-slate-50/50">
                    <td class="py-3 px-4 font-medium border-r border-slate-200">3</td>
                    <td class="py-3 px-6 border-r border-slate-200 capitalize">name</td>
                    <td class="py-3 px-6 font-semibold text-black-600  border-r border-slate-200">
                        X-9
                    </td>
                    <td class="py-3 px-6 capitalize">sragen</td>
                </tr>

               
                <tr class="hover:bg-indigo-50/50 transition-colors">
                    <td class="py-3 px-4 font-medium border-r border-slate-200">4</td>
                    <td class="py-3 px-6 border-r border-slate-200 capitalize">name</td>
                    <td rowspan="2" class="py-3 px-6 font-semibold text-black-600  border-r border-slate-200 align-middle">
                        X-10
                    </td>
                    <td class="py-3 px-6 capitalize">klaten</td>
                </tr>

               
                <tr class="hover:bg-indigo-50/50 transition-colors">
                    <td class="py-3 px-4 font-medium border-r border-slate-200">5</td>
                    <td class="py-3 px-6 border-r border-slate-200 capitalize">name</td>
                    
                    <td class="py-3 px-6 capitalize">sukoharjo</td>
                </tr>
            </tbody>

            <tfoot>
                <tr class="bg-slate-800 text-slate-200 font-semibold uppercase text-xs tracking-widest border-t border-slate-300">
                    <td colspan="4" class="py-3 px-6">
                        SMA ABBS
                    </td>
                </tr>
            </tfoot>
        </table>

    </div>

</body>
</html>
